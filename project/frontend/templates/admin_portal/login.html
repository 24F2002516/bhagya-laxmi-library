{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Bhagya Laxmi Library</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gray-100 text-gray-900">

    <div class="min-h-screen flex items-center justify-center px-4">

        <div class="w-full max-w-md">

            <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6 sm:p-8">

                <div class="text-center mb-8">

                    <div class="mx-auto mb-4 w-14 h-14 rounded-2xl bg-gray-900 text-white flex items-center justify-center text-xl font-bold">
                        BL
                    </div>

                    <h1 class="text-2xl font-bold">
                        Admin Login
                    </h1>

                    <p class="mt-2 text-sm text-gray-500">
                        Bhagya Laxmi Library & PG
                    </p>

                </div>

                {% if messages %}
                    <div class="mb-5 space-y-2">
                        {% for message in messages %}
                            <div class="px-4 py-3 rounded-lg bg-red-50 border border-red-200 text-red-700 text-sm">
                                {{ message }}
                            </div>
                        {% endfor %}
                    </div>
                {% endif %}

                <form method="post" class="space-y-5">

                    {% csrf_token %}

                    <div>
                        <label
                            for="email"
                            class="block text-sm font-medium text-gray-700 mb-2">
                            Admin Email
                        </label>

                        <input
                            id="email"
                            name="email"
                            type="email"
                            autocomplete="email"
                            required
                            autofocus
                            placeholder="admin@example.com"
                            class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-900">
                    </div>

                    <div>

                        <label
                            for="password"
                            class="block text-sm font-medium text-gray-700 mb-2">
                            Password
                        </label>

                        <div class="relative">

                            <input
                                id="password"
                                name="password"
                                type="password"
                                autocomplete="current-password"
                                required
                                placeholder="Enter your password"
                                class="w-full px-4 py-3 pr-12 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-900">

                            <button
                                type="button"
                                id="password-toggle"
                                class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-900"
                                aria-label="Show password">
                                👁
                            </button>

                        </div>

                    </div>

                    <button
                        type="submit"
                        class="w-full py-3 px-4 rounded-lg bg-gray-900 text-white font-semibold hover:bg-gray-800 transition">
                        Sign in to Admin Portal
                    </button>

                </form>

                <div class="mt-6 text-center">

                    <a
                        href="{% url 'core:home' %}"
                        class="text-sm text-gray-500 hover:text-gray-900">
                        ← Back to Library Website
                    </a>

                </div>

            </div>

            <p class="text-center text-xs text-gray-400 mt-6">
                Authorized staff access only
            </p>

        </div>

    </div>

    <script>
        const toggle = document.getElementById("password-toggle");
        const password = document.getElementById("password");

        toggle.addEventListener("click", function () {
            const isHidden = password.type === "password";

            password.type = isHidden ? "text" : "password";

            toggle.textContent = isHidden ? "🙈" : "👁";
            toggle.setAttribute(
                "aria-label",
                isHidden ? "Hide password" : "Show password"
            );
        });
    </script>

</body>
</html>
